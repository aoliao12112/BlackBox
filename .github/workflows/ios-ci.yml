name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate test dataset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("Tests/GroundTruth")
          manifests = sorted(root.glob("gt_*.json"))
          assert len(manifests) == 35, f"expected 35 manifests, got {len(manifests)}"
          docs = [json.loads(path.read_text(encoding="utf-8")) for path in manifests]
          assert len({doc["card_id"] for doc in docs}) == 35
          missing = [doc["image_file"] for doc in docs if not (root / doc["image_file"]).is_file()]
          assert not missing, f"missing images: {missing}"
          print("Validated 35 unique Ground Truth manifests and 35 images")
          PY

      - name: Validate accuracy evaluator
        run: python3 Scripts/evaluate_accuracy.py --actual Tests/GroundTruth

      - name: Select an available iOS Simulator
        run: |
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devices = [device for runtime in data["devices"].values() for device in runtime if "iPhone" in device["name"]]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          PY
          )
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project blackbox.xcodeproj \
            -scheme blackbox \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator and grant privacy permissions
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" DerivedData/Build/Products/Debug-iphonesimulator/blackbox.app
          xcrun simctl privacy "$SIMULATOR_UDID" grant camera none.blackbox
          xcrun simctl privacy "$SIMULATOR_UDID" grant contacts none.blackbox
          xcrun simctl privacy "$SIMULATOR_UDID" grant photos none.blackbox

      - name: Run XCTest
        run: |
          xcodebuild test-without-building \
            -project blackbox.xcodeproj \
            -scheme blackbox \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Seed demo cards and capture simulator screenshots
        run: |
          # xcodebuild may reinstall the host app while running tests. Reapply
          # TCC grants to the installed app before exercising its real UI.
          xcrun simctl privacy "$SIMULATOR_UDID" grant camera none.blackbox
          xcrun simctl privacy "$SIMULATOR_UDID" grant contacts none.blackbox
          xcrun simctl privacy "$SIMULATOR_UDID" grant photos none.blackbox

          APP_DATA=$(xcrun simctl get_app_container "$SIMULATOR_UDID" none.blackbox data)
          SEED_OUTPUT=$(python3 Scripts/seed_simulator_data.py "$APP_DATA/Documents/business_cards")
          echo "$SEED_OUTPUT"
          DETAIL_CARD_ID=$(echo "$SEED_OUTPUT" | sed -n 's/^DETAIL_CARD_ID=//p')
          mkdir -p SimulatorScreenshots

          xcrun simctl terminate "$SIMULATOR_UDID" none.blackbox 2>/dev/null || true
          xcrun simctl launch "$SIMULATOR_UDID" none.blackbox
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot SimulatorScreenshots/01-home-with-seeded-cards.png

          xcrun simctl terminate "$SIMULATOR_UDID" none.blackbox
          xcrun simctl launch "$SIMULATOR_UDID" none.blackbox --screenshot-card-id "$DETAIL_CARD_ID"
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot SimulatorScreenshots/02-card-detail-with-images.png

          xcrun simctl terminate "$SIMULATOR_UDID" none.blackbox
          xcrun simctl launch "$SIMULATOR_UDID" none.blackbox --screenshot-scanner
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot SimulatorScreenshots/03-scanner-authorized.png

      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCTest-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-screenshots
          path: SimulatorScreenshots
          if-no-files-found: error
